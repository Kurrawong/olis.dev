[project]
name = "olis.dev"
version = "0.1.0"
description = "The content of the website https://olis.dev"
authors = [{ name = "Nicholas Car", email = "nick@kurrawong.ai" }]
requires-python = ">=3.12,<4"
dependencies = [
    "mkdocs-material>=8.3.9,<9",
    "mkdocs-redirects>=1.2.1,<2",
    "prezmanifest[azure]>=1.1.1",
    "rdf-delta",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs"]

[tool.uv.sources]
rdf-delta = { url = "https://github.com/Kurrawong/rdf-delta-python/archive/refs/tags/0.2.4.zip" }
